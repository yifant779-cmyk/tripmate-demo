<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#176b55"><meta name="apple-mobile-web-app-capable" content="yes"><title>之之小铺</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:#172e2a;background:#f4f6f5;font-size:16px;--green:#176b55;--muted:#657773;--line:#e1e8e5}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:14px;padding:13px 17px;background:var(--green);color:white;font-weight:600;min-height:46px}button:disabled{opacity:.5}button.secondary{background:#eaf1ed;color:#245547}button.danger{color:#a83e3e;background:#fff0ed}button.icon{background:white;color:var(--green);font-size:24px;width:48px;padding:6px}button.text{background:transparent;color:var(--green);padding:8px;min-height:40px}input,select,textarea{width:100%;padding:13px 12px;border:1px solid #ccd8d2;background:#fff;border-radius:12px;color:#172e2a;min-width:0}input:focus,select:focus,textarea:focus{outline:2px solid #78b7a0;outline-offset:1px}label{display:block;font-size:14px;color:#415c54;margin:16px 0 7px}h1,h2,h3,p{margin:0}h1{font-size:23px;letter-spacing:.5px;margin-top:4px}h1 span{font-size:15px;font-weight:400;margin-left:10px;color:var(--muted)}h2{font-size:22px;line-height:1.4}h3{font-size:17px}small,.muted{color:var(--muted)}small{font-size:12px;letter-spacing:1.4px}.muted{font-size:14px;line-height:1.65}.app{max-width:580px;margin:auto;min-height:100dvh}header{padding:calc(24px + env(safe-area-inset-top)) 22px 22px;display:flex;justify-content:space-between;align-items:center}main{padding:0 18px calc(115px + env(safe-area-inset-bottom))}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,580px);display:grid;grid-template-columns:repeat(4,1fr);padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:#fffff <div class="app"><header><div><small>ZHIZHI SHOP</small><h1>之之小铺<span>经营账本</span></h1></div><button class="icon" id="settings" aria-label="备份与设置">⚙</button></header><div id="portable-mode" class="notice" style="margin:0 18px 18px">之之小铺 · 无需登录。数据保存在当前浏览器，请定期下载完整备份。</div><main id="main"></main><nav aria-label="主导航"><button data-tab="home">◷<span>概览</span></button><button data-tab="analysis">▥<span>分析</span></button><button data-tab="entry">＋<span>记一笔</span></button><button data-tab="orders">▤<span>订单</span></button><button data-tab="manage">▦<span>管理</span></button></nav></div><dialog id="modal"><div id="modal-body"></div><button class="secondary full" id="close-modal">关闭</button></dialog><div id="toast" role="status"></div><script>
let portableTemporary=false;
try { const probe='zhizhi-storage-check-'+Date.now();localStorage.setItem(probe,'1');localStorage.removeItem(probe); } catch { portableTemporary=true; }
const portableMemory=new Map();
const portableStorage=portableTemporary?{getItem:k=>portableMemory.get(k)||null,setItem:(k,v)=>portableMemory.set(k,String(v))}:localStorage;
</script><script>'use strict';
function safeLink(value){if(!value)return '';try{const u=new URL(value);return ['https:','http:'].includes(u.protocol)&&!u.username&&!u.password?u.href:'';}catch{return '';}}
function validateExtras(d){if(d.snippets===undefined)d.snippets=[];if(!Array.isArray(d.snippets)||d.snippets.length>5000)throw Error('话术备份格式不正确');const ids=new Set();for(const t of d.snippets){if(!t||typeof t.id!=='string'||!/^[a-zA-Z0-9_-]{1,100}$/.test(t.id)||ids.has(t.id)||!['title','category','content'].every(k=>typeof t[k]==='string')||!t.title.trim()||!t.content.trim()||t.title.length>100||t.category.length>50||t.content.length>10000)throw Error('话术数据不正确');ids.add(t.id);}for(const p of d.products){for(const key of ['link','code','deliveryNote']){if(p[key]===undefined)p[key]='';if(typeof p[key]!=='string'||p[key].length>5000)throw Error('商品链接数据不正确');}if(p.link&&!safeLink(p.link))throw Error('商品链接必须以 https:// 或 http:// 开头');}}
function monthShift(value,n){const [y,m]=value.split('-').map(Number),d=new Date(y,m-1+n,1);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;}
function monthMetrics(value,channel=''){const match=o=>!channel||o.channel===channel,os=db.orders.filter(o=>match(o)&&o.date.startsWith(value)),paid=db.orders.filter(o=>match(o)&&o.paid&&o.paidDate.startsWith(value)),gross=os.reduce((a,o)=>a+o.total,0),receipts=paid.reduce((a,o)=>a+o.total-o.fee,0),refunds=db.orders.filter(match).flatMap(o=>o.refunds).filter(r=>r.date.startsWith(value)).reduce((a,r)=>a+r.amount,0),expenses=channel?0:db.expenses.filter(e=>e.date.startsWith(value)).reduce((a,e)=>a+e.amount,0);return {orders:os,gross,count:os.length,receipts:receipts-refunds,refunds,expenses,balance:receipts-refunds-expenses};}
function productRanking(os){const ranks=new Map();for(const o of os){const seen=new Set();for(const i of o.items){let r=ranks.get(i.productId);if(!r){r={name:db.products.find(p=>p.id===i.productId)?.name||i.name,qty:0,orders:0};ranks.set(i.productId,r);}r.qty+=i.qty;if(!seen.has(i.productId)){r.orders++;seen.add(i.productId);}}}return [...ranks.values()].sort((a,b)=>b.qty-a.qty);}
function analysisPage(){const m=monthMetrics(month),prev=monthMetrics(monthShift(month,-1)),ranks=productRanking(m.orders),maxQty=ranks[0]?.qty||1,trend=Array.from({length:6},(_,i)=>{const key=monthShift(month,i-5);return {key,...monthMetrics(key)};}),maxTrend=Math.max(1,...trend.map(t=>Math.max(t.receipts,t.expenses,0))),delta=m.gross-prev.gross,known=m.orders.filter(o=>o.customer),keys=new Set(known.map(o=>JSON.stringify([o.channel,o.customer]))),repeat=[...keys].filter(k=>db.orders.some(o=>o.date<month+'-01'&&JSON.stringify([o.channel,o.customer])===k)).length;return `<div class="row"><h2>经营分析</h2><input id="analysis-month" class="month" type="month" aria-label="分析月份" value="${month}"></div><p class="muted subtitle">看清收入来源，找到下一步方向。</p><div class="card hero"><p>本月经营结余</p><div class="amount">${money(m.balance)}</div><p class="muted">到账 ${money(m.receipts)} · 支出 ${money(m.expenses)}</p></div><div class="stats"><div class="card"><p class="muted">成交额</p><div class="stat-number">${money(m.gross)}</div><p class="tiny gap">较上月 ${delta>=0?'增加':'减少'} ${money(Math.abs(delta))}</p></div><div class="card"><p class="muted">平均客单价</p><div class="stat-number">${money(m.count?Math.round(m.gross/m.count):0)}</div><p class="tiny gap">${m.count} 笔成交订单</p></div><div class="card"><p class="muted">本月退款支出</p><div class="stat-number">${money(m.refunds)}</div></div><div class="card"><p class="muted">回购客户</p><div class="stat-number">${repeat}<span class="muted"> / ${keys.size} 人</span></div></div></div><h3 class="section">近六个月收支</h3><div class="card"><p class="tiny">绿色：实际到账　橙色：经营支出</p>${trend.map(t=>`<div class="list-item"><div class="row"><strong>${t.key}</strong><span class="tiny">结余 ${money(t.balance)}</span></div><div class="trend-label">到账 ${money(t.receipts)}</div><div class="bar"><i style="width:${Math.max(0,t.receipts)/maxTrend*100}%"></i></div><div class="trend-label">支出 ${money(t.expenses)}</div><div class="bar expense-bar"><i style="width:${t.expenses/maxTrend*100}%"></i></div></div>`).join('')}<p class="tiny gap">退款可能使到账为负，负数仅显示金额。</p></div><h3 class="section">渠道对比</h3><div class="card">${channels.map(c=>{const v=monthMetrics(month,c);return `<div class="list-item"><div class="row"><strong>${c}</strong><span>${v.count} 单</span></div><p>成交 ${money(v.gross)} · 到账 ${money(v.receipts)}</p><div class="bar"><i style="width:${m.gross?v.gross/m.gross*100:0}%"></i></div></div>`;}).join('')}</div><h3 class="section">热销资料</h3><div class="card">${ranks.length?ranks.slice(0,10).map((r,i)=>`<div class="list-item"><div class="row"><strong>${i+1}. ${esc(r.name)}</strong><span>${r.qty} 份</span></div><p>出现在 ${r.orders} 笔订单中</p><div class="bar"><i style="width:${r.qty/maxQty*100}%"></i></div></div>`).join(''):empty('还没有销售数据','记下第一单后，这里会自动生成分析。')}</div><div class="notice">成交额、客单价与资料销量按订单日期统计，包含已退款订单；一单多份资料按数量累计，不重复分摊整单金额。到账按收款日期扣平台费和当期退款；支出按支出日期统计。回购客户指本月下单且此前月份已有订单的同渠道同昵称客户，未填昵称不计入。</div>`;}
function bindAnalysis(){$('#analysis-month').onchange=e=>{month=e.target.value||today().slice(0,7);render();};}
function deliveryText(p){return [p.name,p.link&&'资料链接：'+p.link,p.code&&'提取码：'+p.code,p.deliveryNote].filter(Boolean).join('\n');}
function deliveryButtons(p){return p.link?`<div class="actions"><a class="button-link secondary" href="${esc(safeLink(p.link))}" target="_blank" rel="noopener noreferrer">打开链接</a><button class="secondary" data-copy-product="${esc(p.id)}">复制发货内容</button></div>`:'';}
function orderDelivery(o){const ps=[...new Set(o.items.map(i=>i.productId))].map(id=>db.products.find(p=>p.id===id)).filter(Boolean);return `<details class="delivery-box"><summary>商品交付链接</summary><p class="tiny">这里显示商品库中最新保存的链接；复制或打开不会自动标记交付。</p>${ps.map(p=>`<div class="list-item"><strong>${esc(p.name)}</strong>${p.link?`${p.code?`<p class="muted">提取码：${esc(p.code)}</p>`:''}${deliveryButtons(p)}`:`<p class="tiny gap">还没有保存交付链接。</p><button class="text" data-product="${esc(p.id)}">添加链接</button>`}</div>`).join('')}</details>`;}
let linkQuery='',scriptQuery='',scriptCategory='';
function linksPage(){const ps=db.products.filter(p=>p.active&&`${p.name} ${p.deliveryNote}`.toLowerCase().includes(linkQuery.toLowerCase()));return `<p class="notice gap">为每份资料保存网盘或商品链接。发货时可打开链接，或复制名称、链接、提取码和说明。</p><input id="link-search" class="gap" aria-label="搜索商品链接" placeholder="搜索资料名称" value="${esc(linkQuery)}"><div class="card gap">${ps.length?ps.map(p=>`<div class="list-item"><div class="row"><strong>${esc(p.name)}</strong><button class="text" data-product="${esc(p.id)}">${p.link?'编辑':'添加链接'}</button></div>${p.link?`<p class="link-preview">${esc(p.link)}</p>${p.code?`<p>提取码：${esc(p.code)}</p>`:''}${p.deliveryNote?`<p class="preserve">${esc(p.deliveryNote)}</p>`:''}${deliveryButtons(p)}`:'<p>尚未保存链接</p>'}</div>`).join(''):empty('没有匹配的资料','可以先在资料库新增商品，或调整搜索。')}</div>`;}
function scriptsPage(){const cats=[...new Set(db.snippets.map(t=>t.category).filter(Boolean))],ts=db.snippets.filter(t=>(!scriptCategory||t.category===scriptCategory)&&`${t.title} ${t.content} ${t.category}`.toLowerCase().includes(scriptQuery.toLowerCase()));return `<div class="row section"><h3>我的话术 · ${db.snippets.length} 条</h3><button class="text" id="add-script">＋ 新增话术</button></div><div class="two"><input id="script-search" aria-label="搜索话术" placeholder="搜索标题或内容" value="${esc(scriptQuery)}"><select id="script-category" aria-label="话术分类"><option value="">全部分类</option>${options(cats,scriptCategory)}</select></div><div class="gap">${ts.length?ts.map(t=>`<div class="card"><div class="row"><h3>${esc(t.title)}</h3><span class="pill">${esc(t.category||'未分类')}</span></div><p class="preserve script-content">${esc(t.content)}</p><div class="actions"><button data-copy-script="${esc(t.id)}">复制话术</button><button class="secondary" data-script="${esc(t.id)}">编辑</button></div></div>`).join(''):empty('把常用回复存起来','例如：售前介绍、发货说明、提取码提醒和售后回复。','<button id="first-script">＋ 添加第一条话术</button>')}</div>`;}
function bindExtrasManage(){const bindSearch=(id,save)=>{if(!$(id))return;$(id).oninput=e=>{const pos=e.target.selectionStart;save(e.target.value);render();$(id).focus();$(id).setSelectionRange(pos,pos);};};bindSearch('#link-search',v=>linkQuery=v);bindSearch('#script-search',v=>scriptQuery=v);if($('#script-category'))$('#script-category').onchange=e=>{scriptCategory=e.target.value;render();};for(const id of ['#add-script','#first-script'])if($(id))$(id).onclick=()=>scriptEditor();}
function editProductV2(id){const p=db.products.find(x=>x.id===id);open(`<h2>${p?'编辑资料与链接':'新增资料'}</h2><form id="product-form"><label for="product-name">资料名称</label><input id="product-name" name="name" value="${esc(p?.name||'')}" required maxlength="100" placeholder="例如：GESP 1—3级套餐"><label for="product-price">默认售价（元，可留 0）</label><input id="product-price" name="price" inputmode="decimal" value="${p?(p.price/100).toFixed(2):'0'}" required><div class="divider"></div><h3>交付链接</h3><label for="product-link">资料 / 网盘 / 商品链接</label><input id="product-link" name="link" type="url" inputmode="url" placeholder="https://…" maxlength="5000" value="${esc(p?.link||'')}"><label for="product-code">提取码（选填）</label><input id="product-code" name="code" maxlength="100" value="${esc(p?.code||'')}" placeholder="例如：abcd"><label for="delivery-note">发货附言（选填）</label><textarea id="delivery-note" name="deliveryNote" maxlength="3000" placeholder="例如：请先保存到自己的网盘，有问题随时联系。">${esc(p?.deliveryNote||'')}</textarea><p class="tiny gap">复制发货内容时，会一起带上资料名、链接、提取码和附言。</p><button class="full gap">保存资料</button></form>${p?'<button id="archive-product" class="danger full">归档资料</button>':''}`);$('#product-form').onsubmit=e=>{e.preventDefault();try{const v=new FormData(e.target),name=v.get('name').trim(),price=cents(v.get('price')),raw=v.get('link').trim(),link=safeLink(raw),code=v.get('code').trim(),deliveryNote=v.get('deliveryNote').trim();if(!name)throw Error('请填写名称');if(raw&&!link)throw Error('请填写 http:// 或 https:// 链接');mutate(d=>{if(d.products.some(x=>x.active&&x.id!==id&&x.name===name))throw Error('资料名称已存在');const fields={name,price,link,code,deliveryNote};if(p)Object.assign(d.products.find(x=>x.id===id),fields);else d.products.push({id:uid(),...fields,active:true});});close();render();toast('资料与链接已保存');}catch(err){toast(err.message);}};if(p)$('#archive-product').onclick=()=>{if(db.products.filter(x=>x.active).length<=1)return toast('请至少保留一款资料');if(!confirm('归档后不再出现在新订单中，历史订单及链接仍保留。继续吗？'))return;try{mutate(d=>d.products.find(x=>x.id===id).active=false);close();render();}catch(e){toast(e.message);}};}

if(!d.products.every(p=>str(p.id)&&str(p.name)&&p.name.trim()&&amt(p.price)&&typeof p.active==='boolean'))throw Error('资料数据不正确');

function commit(next){if(!storageOK)throw Error('本地存储不可用，请先导出数据或换到常用浏览器');validate(next);portableStorage.setItem(KEY,JSON.stringify(next));db=next;}

function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('#main').innerHTML=({home:home,entry:entry,orders:orders,analysis:analysisPage,manage:manage})[tab]();if(tab==='analysis')bindAnalysis();if(tab==='entry')bindEntry();if(tab==='orders')bindFilters();if(tab==='manage')bindManage();if(tab==='home')$('#month').onchange=e=>{month=e.target.value||today().slice(0,7);render();};}

function home(){const os=db.orders.filter(o=>inMonth(o.date)),gross=os.reduce((a,o)=>a+o.total,0),paid=db.orders.filter(o=>o.paid&&inMonth(o.paidDate)),received=paid.reduce((a,o)=>a+o.total-o.fee,0),refunds=db.orders.flatMap(o=>o.refunds).filter(r=>inMonth(r.date)).reduce((a,r)=>a+r.amount,0),expense=db.expenses.filter(e=>inMonth(e.date)).reduce((a,e)=>a+e.amount,0),pending=os.filter(o=>!o.paid).reduce((a,o)=>a+o.total,0),undelivered=db.orders.filter(o=>!o.delivered&&refunded(o)<o.total).length;return `<div class="row section" style="margin-top:0"><div><h2>每一单，都有数。</h2><p class="muted">小生意，也要认真记录</p></div></div><div class="card hero"><div class="row"><span class="balance-label">本月经营结余</span><input class="month" aria-label="统计月份" id="month" type="month" value="${month}"></div><div class="amount">${money(received-refunds-expense)}</div><div class="row"><div><div class="muted">实际到账</div><strong>${money(received-refunds)}</strong></div><div><div class="muted">经营支出</div><strong>${money(expense)}</strong></div></div></div><div class="stats"><div class="card"><p class="muted">本月成交额</p><div class="stat-number">${money(gross)}</div></div><div class="card"><p class="muted">本月订单</p><div class="stat-number">${os.length}<span class="muted"> 单</span></div></div></div><button class="full gap" data-go="entry">＋ 记一笔新订单</button><div class="row section"><h3>待办小提醒</h3><span class="tiny">待交付包含全部月份</span></div><div class="card row"><div><p class="muted">本月订单待收款</p><strong>${money(pending)}</strong></div><div><p class="muted">待交付订单</p><strong>${undelivered} 单</strong></div></div><h3 class="section">渠道表现 <span class="tiny">按成交日期 · 成交额</span></h3><div class="card">${channels.map(ch=>{const a=os.filter(o=>o.channel===ch),v=a.reduce((s,o)=>s+o.total,0);return `<div class="list-item"><div class="row"><span>${ch} <span class="tiny">${a.length} 单</span></span><strong>${money(v)}</strong></div><div class="bar"><i style="width:${gross?v/gross*100:0}%"></i></div></div>`;}).join('')}</div><h3 class="section">最近订单</h3><div class="card">${db.orders.length?db.orders.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,3).map(orderCard).join(''):empty('从第一笔开始','添加一笔订单，这里就会有记录。')}</div><p class="tiny">到账按收款日期统计，退款按退款日期扣除；待收款按订单日期统计。平台扣费在收款时扣除。数据仅保存在当前浏览器。</p>`;}
function entry(){const o=db.orders.find(x=>x.id===editId);return `<h2>${o?'编辑订单':'记一笔'}</h2><p class="muted subtitle">把今天的成交，稳稳记下来。</p>${!o?`<div class="chips"><button data-entry="sale" class="${entryType==='sale'?'selected':''}">销售收入</button><button data-entry="expense" class="${entryType==='expense'?'selected':''}">经营支出</button></div>`:''}<form id="entry-form" class="card gap">${entryType==='expense'&&!o?`<label for="amount">支出金额（元）</label><input id="amount" name="amount" inputmode="decimal" placeholder="0.00" required><label>支出类别</label><select name="category">${options(['资料采购','推广费用','软件订阅','制作费用','其他支出'])}</select><label>支出日期</label><input type="date" name="date" value="${today()}" required><label>备注</label><textarea name="note" placeholder="例如：本月资料推广" maxlength="1000"></textarea>`:`<label>销售渠道</label><select name="channel">${options(channels,o?.channel||portableStorage.getItem('last-channel')||'闲鱼')}</select><label>购买资料</label><div id="items"></div><button type="button" class="text" id="add-item">＋ 再加一份资料</button><label for="amount">整单成交金额（元）</label><input id="amount" name="amount" inputmode="decimal" placeholder="填写本次实际成交价" value="${o?(o.total/100).toFixed(2):''}" required><p class="tiny gap" id="price-hint">默认价可在「管理」中设置；套餐可直接改整单金额。</p><div class="two"><div><label>订单日期</label><input type="date" name="date" value="${o?.date||today()}" required></div><div><label>客户昵称（选填）</label><input name="customer" placeholder="平台昵称或客户代号" maxlength="100" value="${esc(o?.customer||'')}"></div></div><label class="toggle"><input type="checkbox" name="paid" ${!o||o.paid?'checked':''}>已收款</label><div id="paid-fields"><div class="two"><div><label>收款日期</label><input type="date" name="paidDate" value="${o?.paidDate||today()}"></div><div><label>平台扣费（元）</label><input name="fee" inputmode="decimal" value="${o?(o.fee/100).toFixed(2):'0'}"></div></div></div><label class="toggle"><input type="checkbox" name="delivered" ${o?.delivered?'checked':''}>已交付资料</label><details><summary>备注与更多说明</su function addItem(i){const row=document.createElement('div');row.className='product-line';row.innerHTML=`<select aria-label="购买资料" class="product">${db.products.filter(p=>p.active||p.id===i?.productId).map(p=>`<option value="${esc(p.id)}" ${p.id===i?.productId?'selected':''}>${esc(p.name)}</option>`).join('')}</select><input aria-label="数量" class="qty" type="number" min="1" max="999" step="1" value="${i?.qty||1}" required><button type="button" aria-label="移除这份资料">×</button>`;$('#items').append(row);row.querySelector('button').onclick=()=>{if($('#items').children.length<2)return toast('至少保留一份资料');row.remove();suggestPrice();};row.querySelector('select').onchange=suggestPrice;row.querySelector('input').oninput=suggestPrice;}
function suggestPrice(){const rows=[...document.querySelectorAll('.product-line')];const sum=rows.reduce((a,r)=>a+(db.products.find(p=>p.id===r.querySelector('select').value)?.price||0)*Number(r.querySelector('input').value||0),0);if(sum>0)$('#amount').value=(sum/100).toFixed(2);else $('#amount').value='';}
function bindEntry(){document.querySelectorAll('[data-entry]').forEach(b=>b.onclick=()=>{entryType=b.dataset.entry;render();});const o=db.orders.find(x=>x.id===editId),f=$('#entry-form');if(entryType==='sale'||o){(o?.items||[null]).forEach(addItem);$('#add-item').onclick=()=>{addItem();suggestPrice();};f.paid.onchange=()=>{$('#paid-fields').hidden=!f.paid.checked;};f.paid.onchange();if(!o)suggestPrice();}f.onsubmit=e=>{e.preventDefault();try{const v=new FormData(f),amount=cents(v.get('amount'));if(amount<=0)throw Error('金额需要大于 0');if(entryType==='expense'&&!o){mutate(d=>d.expenses.unshift({id:uid(),date:v.get('date'),amount,category:v.get('category'),note:v.get('note').trim()}));toast('支出已记录');goto('home');return;}const fee=cents(v.get('fee')||'0'),paid=v.has('paid');if(fee>amount)throw Error('平台扣费不能超过成交金额');if(o?.refunds.length&&(!paid||amount<refunded(o)))throw Error('已有退款的订单需要保持已收款，成交金额不能小于退款');const items=[...document.querySelectorAll('.product-line')].map(r=>{const p=db.products.find(x=>x.id===r.querySelector('select').value);if(!p)throw Error('请先添加资料');const qty=Number(r.querySelector('input').value);return{productId:p.id,name:p.name,qty};});const order={id:o?.id||uid(),date:v.get('date'),channel:v.get('channel'),total:amount,fee,paid,paidDate:paid?v.get('paidDate'):'',delivered:v.has('delivered'),customer:v.get('customer').trim(),note:v.get('note').trim(),items,refunds:o?.refunds||[]};mutate(d=>{const n=d.orders.findIndex(x=>x.id===order.id);if(n<0)d.orders.unshift(order);else d.orders[n]=order;});try{portableStorage.setItem('last-channel',order.channel);}catch{}toast('订单已保存');goto('orders');}catch(err){toast(err.message);}};}
function orderCard(o){return `<div class="list-item"><div class="row start"><div><strong>${esc(itemText(o))}</strong><p>${esc(o.customer||'未填写客户')} · ${o.channel} · ${o.date}</p></div><span class="money">${money(o.total)}</span></div><div class="row"><div><span class="pill ${o.paid?'':'red'}">${o.paid?'已收款':'待收款'}</span> <span class="pill ${o.delivered?'':'red'}">${o.delivered?'已交付':'待交付'}</span>${refunded(o)?` <span class="pill red">退 ${money(refunded(o))}</span>`:''}</div><button class="text" data-order="${esc(o.id)}">详情</button></div></div>`;}
function orders(){const os=db.orders.filter(o=>(!month||inMonth(o.date))&&(!filterChannel||o.channel===filterChannel)&&(!filterStatus||(filterStatus==='unpaid'?!o.paid:!o.delivered&&refunded(o)<o.total))&&`${o.customer} ${itemText(o)} ${o.note}`.toLowerCase().includes(search.toLowerCase()));return `<div class="row"><h2>订单记录</h2><button class="text" data-go="entry">＋ 记单</button></div><div class="filters"><input id="search" aria-label="搜索订单" placeholder="搜索客户、资料、备注" value="${esc(search)}"><div class="two"><input id="order-month" aria-label="订单月份" type="month" value="${month}"><select id="filter-channel" aria-label="筛选渠道"><option value="">全部渠道</option>${options(channels,filterChannel)}</select></div><div class="chips"><button data-filter="" class="${!filterStatus?'selected':''}">全部订单</button><button data-filter="unpaid" class="${filterStatus==='unpaid'?'selected':''}">待收款</button><button data-filter="undelivered" class="${filterStatus==='undelivered'?'selected':''}">待交付</button><button id="all-months">全部月份</button></div></div><p class="tiny">${os.length} 笔订单 · 成交 ${money(os.reduce((a,o)=>a+o.total,0))} · 按订单日期筛选</p><div class="card gap" id="order-list">${os.length?os.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(orderCard).join(''):empty('还没有符合条件的订单','调整筛选条件，或记下你的第一单。','<button data-go="entry">＋ 记一笔</button>')}</div>`;}
function bindFilters(){$('#search').oninput=e=>{search=e.target.value;const pos=e.target.selectionStart;render();$('#search').focus();$('#search').setSelectionRange(pos,pos);};$('#order-month').onchange=e=>{month=e.target.value;render();};$('#filter-channel').onchange=e=>{filterChannel=e.target.value;render();};document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filterStatus=b.dataset.filter;render();});$('#all-months').onclick=()=>{month='';render();};}
function detail(id){const o=db.orders.find(x=>x.id===id);if(!o)return;open(`<h2>订单详情</h2><h3>${esc(itemText(o))}</h3><div class="amount">${money(o.total)}</div><p class="muted">${o.channel} · ${o.date}<br>客户：${esc(o.customer||'未填写')}<br>收款：${o.paid?o.paidDate:'待收款'} · 平台扣费 ${money(o.fee)}<br>交付：${o.delivered?'已交付':'待交付'}</p>${o.note?`<p class="notice gap">${esc(o.note)}</p>`:''}${orderDelivery(o)}<div class="actions"><button data-edit="${id}">编辑订单</button>${!o.delivered?`<button class="secondary" data-deliver="${id}">标记已交付</button>`:''}</div><div class="divider"></div><h3>退款记录</h3>${o.refunds.length?o.refunds.map(r=>`<p class="muted gap">${r.date} · ${money(r.amount)}</p>`).join(''):'<p class="muted gap">暂无退款</p>'}${o.paid&&refunded(o)<o.total?`<form id="refund-form"><label>本次退款金额（元）</label><input name="amount" inputmode="decimal" required placeholder="最多 ${((o.total-refunded(o))/100).toFixed(2)}"><label>退款日期</label><input name="date" type="date" value="${today()}" required><button class="secondary full">登记退款</button></form>`:''}<button class="danger full" data-delete-order="${id}">删除订单</button>`);if($('#refund-form'))$('#refund-form').onsubmit=e=>{e.preventDefault();try{const f=e.target,n=cents(f.amount.value);if(n<=0||n>o.total-refunded(o))throw Error('退款金额超出可退金额');mutate(d=>d.orders.find(x=>x.id===id).refunds.push({amount:n,date:f.date.value}));toast('退款已登记');render();detail(id);}catch(err){toast(err.message);}};}
function manage(){return `<h2>经营管理</h2><p class="muted subtitle">整理资料，也记住每一位客户。</p><div class="chips"><button data-manage="products" class="${manageType==='products'?'selected':''}">资料库</button><button data-manage="links" class="${manageType==='links'?'selected':''}">商品链接</button><button data-manage="scripts" class="${manageType==='scripts'?'selected':''}">常用话术</button><button data-manage="customers" class="${manageType==='customers'?'selected':''}">客户</button><button data-manage="expenses" class="${manageType==='expenses'?'selected':''}">支出</button></div>${manageType==='products'?`<div class="row section"><h3>我的资料 · ${db.products.filter(p=>p.active).length} 款</h3><button class="text" id="add-product">＋ 新增</button></div><div class="card">${db.products.filter(p=>p.active).map(p=>`<div class="row list-item"><div><strong>${esc(p.name)}</strong><p>${p.price?'默认价 '+money(p.price):'未设置默认价'}</p></div><button class="text" data-product="${esc(p.id)}">编辑</button></div>`).join('')}</div><p class="tiny">可以新增组合套餐。修改资料名称或默认价，不会改动历史订单。</p>`:manageType==='links'?linksPage():manageType==='scripts'?scriptsPage():manageType==='customers'?customers():expenses()}`;}
function customers(){const groups=new Map();db.orders.filter(o=>o.customer).forEach(o=>{const k=JSON.stringify([o.channel,o.customer]);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(o);});return `<div class="notice gap">客户按「渠道＋昵称」自动归档；当前不会合并跨平台身份。</div><div class="card gap">${groups.size?[...groups.values()].map(os=>{const o=os[0];return `<div class="list-item"><div class="row"><strong>${esc(o.customer)}</strong><span class="pill">${o.channel}</span></div><p>${os.length} 次购买 · 实收（扣费前） ${money(os.filter(x=>x.paid).reduce((a,x)=>a+x.total-refunded(x),0))}</p><details><summary>查看购买记录</summary>${os.map(orderCard).join('')}</details></div>`;}).join(''):empty('客户会自动积累','记单时填写客户昵称，就能在这里查看购买历史。')}</div>`;}
function expenses(){const es=db.expenses.filter(e=>!month||inMonth(e.date));return `<div class="row section"><h3>支出明细</h3><input type="month" class="month" id="expense-month" aria-label="支出月份" value="${month}"></div><p class="muted">共 ${es.length} 笔 · ${money(es.reduce((a,e)=>a+e.amount,0))}</p><div class="card gap">${es.length?es.map(e=>`<div class="list-item"><div class="row"><strong>${esc(e.category)}</strong><strong>${money(e.amount)}</strong></div><p>${e.date} ${esc(e.note)}</p><button class="text" data-delete-expense="${esc(e.id)}">删除</button></div>`).join(''):empty('还没有经营支出','采购、推广、订阅等费用，都可以单独记录。')}<button class="secondary full gap" id="new-expense">＋ 记录支出</button></div>`;}
function bindManage(){bindExtrasManage();document.querySelectorAll('[data-manage]').forEach(b=>b.onclick=()=>{manageType=b.dataset.manage;render();});if($('#add-product'))$('#add-product').onclick=()=>productEditor();if($('#expense-month'))$('#expense-month').onchange=e=>{month=e.target.value;render();};if($('#new-expense'))$('#new-expense').onclick=()=>{entryType='expense';goto('entry');};}
function productEditor(id){editProductV2(id);}
function download(name,data,type){const url=URL.createObjectURL(new Blob([data],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),10000);}
function settings(){open(`<h2>备份与使用说明</h2><div class="notice ${storageOK?'':'warn'}">${portableTemporary?'当前为临时模式：此打开方式不允许持久存储，关闭后记录会丢失，请在关闭前下载完整备份。':storageOK?'当前使用本地保存模式。数据只在这台设备的这个浏览器中，不会上传到账户，也不会自动同步。':'本地存储读取失败。请勿继续记账，先尝试导出原始数据，再到常用浏览器中恢复。'}</div><p class="muted gap">请固定使用同一个手机浏览器。清理网站数据、无痕模式或更换设备，可能导致记录丢失。建议每周下载一次备份。</p><button id="export-json" class="full gap">下载完整备份（可恢复）</button><button id="export-csv" class="secondary full">导出订单表格（CSV）</button><div class="divider"></div><h3>从备份恢复</h3><p class="tiny gap">仅接受本工具的 JSON 备份。恢复会覆盖当前全部资料、链接、话术、订单和支出；导入前请先下载当前备份。</p><label for="import-file">选择备份文件</label><input id="import-file" type="file" accept=".json,application/json"><div class="divider"></div><p class="muted">使用建议：先到「管理」设置售价，再记第一单。订单可编辑、登记部分退款或标记交付。客户昵称相同且渠道一致时，会自动汇总购买记录。</p><p class="tiny gap">统计口径：成交额按订单日期；实际到账按收款日期扣平台费，再扣当期退款；经营结余再减当期支出。</p>`);$('#export-json').onclick=()=>{const raw=!storageOK?portableStorage.getItem(KEY):JSON.stringify(db,null,2);download('之之小铺账本-'+today()+'.json',raw||JSON.stringify(db),'application/json');toast('已发起下载，请保存到手机文件中');};$('#export-csv').onclick=()=>{const cell=v=>'"'+String(v).replace(/^[=+@-]/,"'$&").replace(/"/g,'""')+'"';const rows=[['订单ID','订单日期','渠道','客户','资料','成交金额','已收款','收款日期','平台扣费','已退款','已交付','备注'],...db.orders.map(o=>[o.id,o.date,o.channel,o.customer,itemText(o),(o.total/100).toFixed(2),o.paid?'是':'否',o.paidDate,(o.fee/100).toFixed(2),(refunded(o)/100).toFixed(2),o.delivered?'是':'否',o.note])];download('订单-'+today()+'.csv','\ufeff'+rows.map(r=>r.map(cell).join(',')).join('\r\n'),'text/csv;charset=utf-8');};$('#import-file').onchange=async e=>{try{const file=e.target.files[0];if(!file)return;if(file.size>20e6)throw Error('备份文件超过 20MB');const next=JSON.parse(await file.text());validate(next);if(!confirm(`备份包含 ${next.orders.length} 笔订单、${next.expenses.length} 笔支出、${next.snippets.length} 条话术。恢复将覆盖当前全部数据，确定继续？`))return;portableStorage.setItem(KEY,JSON.stringify(next));db=next;storageOK=true;close();render();toast('备份已恢复');}catch(err){toast('恢复失败：'+err.message);}};}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;try{if(b.dataset.go){if(b.dataset.go==='entry')entryType='sale';goto(b.dataset.go);}if(b.dataset.order)detail(b.dataset.order);if(b.dataset.product)productEditor(b.dataset.product);if(b.dataset.edit){editId=b.dataset.edit;entryType='sale';tab='entry';close();render();}if(b.dataset.deliver){mutate(d=>d.orders.find(o=>o.id===b.dataset.deliver).delivered=true);render();detail(b.dataset.deliver);toast('已标记交付');}if(b.dataset.deleteOrder&&confirm('确定删除这笔订单及其退款记录？此操作无法撤销。')){mutate(d=>d.orders=d.orders.filter(o=>o.id!==b.dataset.deleteOrder));close();render();toast('订单已删除');}if(b.dataset.deleteExpense&&confirm('确定删除这笔支出？')){mutate(d=>d.expenses=d.expenses.filter(x=>x.id!==b.dataset.deleteExpense));render();toast('支出已删除');}}catch(err){toast(err.message);}});
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{if(b.dataset.tab==='entry')entryType='sale';if(!month&&b.dataset.tab==='home')month=today().slice(0,7);goto(b.dataset.tab);});$('#settings').onclick=settings;$('#close-modal').onclick=close;render();if(!storageOK)setTimeout(settings,100);





if(portableTemporary){document.getElementById('portable-mode').classList.add('warn');document.getElementById('portable-mode').textContent='临时模式：当前打开方式无法长期保存。关闭前请点右上角齿轮下载完整备份，下次打开后恢复。';}
</script></body></html>
